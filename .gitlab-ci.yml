# ---------------------------------------------------------------------------
# Vistaar Dashboard (Create React App — static SPA) — GitLab CI/CD.
# Pipeline runs only for an MR targeting main, or main itself. On merge to main
# → build gate → auto-deploy: build the static bundle on the server; nginx
# serves /srv/vistaar-dashboard/build directly (no pm2). Domain:
# dashboard-vistaar.yugam.co. Build-time env (REACT_APP_*) comes from the GitLab
# File variable APP_ENV, written to .env.production.local before the build.
# Required CI/CD vars (Protected): SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS,
#   DEPLOY_HOST, DEPLOY_USER, APP_ENV (File).
# ---------------------------------------------------------------------------
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - ci
  - deploy

variables:
  DEPLOY_PATH: "/srv/vistaar-dashboard"

# Build gate — CI=false on the build step so CRA's warnings-as-errors don't
# fail a valid build; tests run with CI=true so watch mode stays off.
build_test:
  stage: ci
  image: node:20-bullseye
  script:
    - npm ci
    - CI=true npm test -- --watchAll=false
    - CI=false npm run build

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs:
    - build_test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client rsync bash curl
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - >
      rsync -az --delete
      --exclude '.git' --exclude 'node_modules' --exclude 'build'
      --exclude '.env.production.local' --exclude '*.log'
      ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    # REACT_APP_* bake at build time; .env.production.local has highest CRA
    # precedence so it overrides the committed .env (localhost) for prod builds.
    - scp "$APP_ENV" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env.production.local"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && npm ci && CI=false npm run build && chmod o+x $DEPLOY_PATH"
    - curl -fsS --max-time 20 https://dashboard-vistaar.yugam.co/ >/dev/null && echo healthy
  environment:
    name: production
    url: https://dashboard-vistaar.yugam.co
